name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # モデル（setup_model.sh で生成）がなくてもモックモードでビルドできる
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project learn-yolo-sports.xcodeproj \
            -target learn-yolo-sports \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
